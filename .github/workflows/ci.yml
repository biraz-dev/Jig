name: Rust checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format source and report diff
        run: |
          cargo fmt
          git diff --no-color
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build
      - run: python3 tests/terminal_smoke.py
      - name: Report initial lockfile
        run: cat Cargo.lock
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: jig-linux-x86_64
          path: target/release/jig
