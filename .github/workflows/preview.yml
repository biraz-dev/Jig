name: Browser preview
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --target wasm32-unknown-unknown --no-default-features --features web --bin jig-web -- -D warnings
      - name: Install pinned Trunk
        run: |
          curl -fsSL --retry 3 https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz -o "$RUNNER_TEMP/trunk.tar.gz"
          tar -xzf "$RUNNER_TEMP/trunk.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Fetch verified local OCR assets
        run: python3 scripts/fetch_ocr_assets.py
      - run: trunk build --release --public-url /Jig/
      - name: Identify the tested release
        run: git rev-parse HEAD > dist/jig-release.txt
      - name: Inspect static artifact
        run: |
          test -f dist/index.html
          test -f dist/jig-release.txt
          test -f dist/favicon.svg
          test -f dist/bridge.js
          test -f dist/settings.js
          test -f dist/document_bridge.js
          test -f dist/draft.js
          test -f dist/draft.css
          test -f dist/theme.js
          test -f dist/ocr_bridge.js
          test -f dist/font-license.txt
          test -f dist/vendor/ocr/manifest.json
          test -f dist/vendor/ocr/tesseract.min.js
          test -f dist/vendor/ocr/worker.min.js
          test -f dist/vendor/ocr/core/tesseract-core-lstm.wasm.js
          test -f dist/vendor/ocr/core/tesseract-core-simd-lstm.wasm.js
          test -f dist/vendor/ocr/lang/eng.traineddata.gz
          test -f dist/vendor/ocr/pdf/pdf.mjs
          test -f dist/vendor/ocr/pdf/pdf.worker.mjs
          test -f dist/weather.js
          test -f dist/stl.js
          test -f dist/preview.css
          test -n "$(find dist -name '*.wasm' -print -quit)"
          if find dist -type f \( -name 'jig.json' -o -name '*.md' -o -name '*.lock' -o -name '.env*' \) | grep .; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: jig-browser-dist
          path: dist/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/
  browser:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        suite: [themes_browser, draft_browser, charts_browser, settings_browser, spreadsheet_browser, ocr_browser, timeline_browser, task_lists_browser, notes_browser, browser_smoke, undo_browser]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: jig-browser-dist
          path: dist/
      - name: Install browser test tools
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Exercise the real browser app
        env:
          JIG_RENDER_LOGS: ${{ contains(github.event.head_commit.message, '[render]') && 'theme-nord,theme-dracula,theme-graphite,theme-catppuccin,theme-gruvbox,theme-tokyo-night,theme-dark,theme-dark-mobile,theme-rose-pine,theme-rose-pine-mobile,theme-paper,theme-ember,theme-custom,theme-mobile,theme-failure,draft-desktop,draft-mobile,draft-failure,charts-desktop,charts-controls,charts-mobile,charts-failure,sheet-desktop,sheet-mobile,sheet-edit,sheet-chart,sheet-formats,sheet-import,sheet-failure,undo-desktop,redo-desktop,undo-failure,timeline-desktop,timeline-dashboard,timeline-mobile,timeline-edit,timeline-failure,task-lists-desktop,task-lists-combined,task-lists-mobile,task-lists-failure,notes-desktop,notes-tasks,notes-mobile,notes-cap,notes-failure,calendar-weather-unselected,calendar-weather-selected,calendar-month-desktop,calendar-month-mobile,calendar-month-date-picking,consolidated-empty,consolidated-data-open,calculator-popup-desktop,task-date-time-popup,task-date-time-picker,calendar-task-picking,consolidated-mobile,consolidated-medium,calendar-mobile,settings-header-desktop,settings-about,settings-help,settings-about-mobile,settings-help-mobile,settings-light,settings-mobile,settings-shortcuts,settings-cheatsheet,settings-download-fallback,settings-folder,settings-backup-failed,settings-backup-retrying,settings-backup-recovered,settings-backup-failed-mobile,settings-backup-recovered-mobile,settings-failure' || '' }}
        run: |
          mkdir -p "$RUNNER_TEMP/jig-site/Jig"
          cp -R dist/. "$RUNNER_TEMP/jig-site/Jig/"
          python3 -m http.server 4173 --directory "$RUNNER_TEMP/jig-site" > "$RUNNER_TEMP/jig-http.log" 2>&1 &
          node "tests/${{ matrix.suite }}.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results-${{ matrix.suite }}
          path: playwright-results/
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, browser]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static WASM application
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Check the public custom-domain route
        continue-on-error: true
        shell: bash
        run: |
          curl --connect-timeout 10 --max-time 30 --retry 3 --retry-delay 5 --retry-all-errors -fsSL \
            "https://biraz.dev/Jig/jig-release.txt?release=$GITHUB_SHA" -o "$RUNNER_TEMP/jig-public-release.txt"
          if [ "$(cat "$RUNNER_TEMP/jig-public-release.txt")" != "$GITHUB_SHA" ]; then
            echo '::warning::The custom-domain route serves another release; its hosting bundle needs updating.'
            exit 1
          fi
          curl --connect-timeout 10 --max-time 30 --retry 3 --retry-delay 5 --retry-all-errors -fsSL \
            "https://biraz.dev/Jig/?release=$GITHUB_SHA" -o "$RUNNER_TEMP/jig-public-index.html"
          public_wasm=$(grep -oE 'jig-web-[[:alnum:]]+_bg\.wasm' "$RUNNER_TEMP/jig-public-index.html" | head -n 1)
          test -n "$public_wasm"
          curl --connect-timeout 10 --max-time 30 --retry 3 --retry-delay 5 --retry-all-errors -fsSI \
            "https://biraz.dev/Jig/$public_wasm" | tr -d '\r' | grep -qi '^Content-type: application/wasm'
          echo '::notice::The tested Jig release is available at https://biraz.dev/Jig/'
