[package]
name = "jig"
version = "0.2.0"
edition = "2021"
description = "A local artist's utility workbench"
default-run = "jig"

[features]
default = ["terminal"]
terminal = ["dep:clap", "dep:crossterm", "dep:ratatui"]
web = ["dep:eframe", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:web-sys"]

[[bin]]
name = "jig"
path = "src/main.rs"
required-features = ["terminal"]

[[bin]]
name = "jig-web"
path = "src/bin/jig-web.rs"
required-features = ["web"]

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clap = { version = "4.5", features = ["derive"], optional = true }
crossterm = { version = "0.28", optional = true }
ratatui = { version = "0.29", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"], optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3", features = ["Document", "Window", "HtmlCanvasElement", "HtmlElement"], optional = true }
