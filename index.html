<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Jig: a local spreadsheet, task timeline and artist's workbench. Private document imports, no account or backend.">
  <meta name="referrer" content="no-referrer">
  <title>Jig — You are a small Small Giant Psionicist.</title>
  <link rel="icon" type="image/svg+xml" sizes="any" href="favicon.svg">
  <link data-trunk rel="copy-file" href="web/favicon.svg">
  <link data-trunk rel="rust" data-bin="jig-web" data-cargo-no-default-features data-cargo-features="web">
  <link data-trunk rel="copy-file" href="web/bridge.js">
  <link data-trunk rel="copy-file" href="web/document_bridge.js">
  <link data-trunk rel="copy-file" href="web/ocr_bridge.js">
  <link data-trunk rel="copy-dir" href="web/vendor">
  <link data-trunk rel="copy-file" href="web/font-license.txt">
  <link data-trunk rel="copy-file" href="web/weather.js">
  <link data-trunk rel="copy-file" href="web/stl.js">
  <link data-trunk rel="copy-file" href="web/preview.css">
  <link rel="stylesheet" href="preview.css">
  <script src="bridge.js"></script>
  <script src="document_bridge.js"></script>
  <script src="ocr_bridge.js"></script>
  <script src="weather.js"></script>
  <script src="stl.js"></script>
</head>
<body>
  <main id="loading" role="status">
    <h1>JIG <span>You are a small Small Giant Psionicist.</span></h1>
    <p>Development preview — sample data</p>
    <p id="load-message">Starting the local Rust spreadsheet…</p>
    <p>Everything runs in this browser. No account, backend or telemetry.</p>
    <p><a href="https://github.com/biraz-dev/Jig">Source and build instructions</a></p>
  </main>
  <canvas id="jig_canvas" aria-label="Jig interactive local artist workbench"></canvas>
  <input id="jig-import" type="file" accept=".json,application/json" hidden aria-label="Import Jig JSON state">
  <input id="jig-csv-import" type="file" accept=".csv,text/csv,text/plain" hidden aria-label="Import CSV at the selected cell">
  <input id="jig-ods-import" type="file" accept=".ods,application/vnd.oasis.opendocument.spreadsheet" hidden aria-label="Open an OpenDocument spreadsheet">
  <input id="jig-pdf-import" type="file" accept=".pdf,.png,.jpg,.jpeg,application/pdf,image/png,image/jpeg" multiple hidden aria-label="Import local PDF documents or transaction screenshots">
  <input id="jig-stl-import" type="file" accept=".stl,model/stl,application/sla" hidden aria-label="Open a local STL model">
  <noscript>This preview needs JavaScript and WebAssembly. The offline Rust CLI and terminal dashboard are available in the repository.</noscript>
</body>
</html>
